name: template

services:
  postgres:
    image: postgres:17.5
    container_name: template-postgres
    environment:
      POSTGRES_DB: "${DATABASE_NAME:-template}"
      POSTGRES_USER: "${DATABASE_USER:-template}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-template}"
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - template_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:5.3.0
    container_name: template-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: "ng9"

volumes:
  template_postgres_data:
